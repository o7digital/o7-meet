services:
  meet:
    build: .
    restart: unless-stopped
    env_file: .env.staging
    networks: [meet]
  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    command: ["-n", "--log-file=stdout", "--realm=meet-staging", "--fingerprint", "--lt-cred-mech", "--user=${TURN_USERNAME}:${TURN_PASSWORD}", "--external-ip=${PUBLIC_IP}", "--listening-port=3478", "--min-port=49160", "--max-port=49200", "--no-cli"]
    env_file: .env.staging
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    networks: [meet]
  livekit:
    image: livekit/livekit-server:v1.9.2
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    volumes: ["./livekit.yaml:/etc/livekit.yaml:ro"]
    ports:
      - "7880:7880/tcp"
      - "7881:7881/tcp"
      - "50000-50100:50000-50100/udp"
    networks: [meet]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env.staging
    ports: ["80:80", "443:443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data", "caddy-config:/config"]
    depends_on: [meet]
    networks: [meet]
networks:
  meet:
volumes:
  caddy-data:
  caddy-config:
